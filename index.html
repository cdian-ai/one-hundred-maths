 if(v){ try{ v.currentTime=sec; v.play(); }catch(e){} }
}
function skipTeach(){ V.ph="drill"; V.i=0; V.bad=0; V.miss=0; newQ();
 S.at={id:V.id,ph:"drill",i:0}; save(); render(); }
function toWatch(){V.ph="watch";V.step=0;S.at={id:V.id,ph:"watch",i:0};save();render()}
function stepNext(){V.step++;render()}
function showWhy(i){ if(!V.why) V.why={}; V.why[i]=!V.why[i]; render(); }
/* Three wrong in practice: back to the lesson, with the worked example opened
   out in full and scrolled to, so the child lands on the method rather than on
   the story they have already read. */
function backToWatch(){ const keep=V.i, s=byId(V.id); V.ph="watch"; V.why={}; V.resumeAt=keep;
 V.step=EX(s).steps.length-1; V.read=true;
 if(!(VIDEO[s.g]||{})[L]) V.focus="ex";
 S.at={id:V.id,ph:"watch",i:0}; save(); render(); }
function toGuided(){
 /* coming back from the drill returns you to the drill, not round the loop */
 if(V.resumeAt!==undefined){ const at=V.resumeAt; V.resumeAt=undefined;
  V.ph="drill"; V.i=at; V.bad=0; V.miss=0; newQ();
  S.at={id:V.id,ph:"drill",i:at}; save(); render(); return; }
 V.ph="guided";V.g=0;V.typed="";V.miss=0;S.at={id:V.id,ph:"guided",i:0};save();render()}
function guidedHTML(s,T2){

 return `<div class="wrap"><p class="step">${esc(s[L]||s.en)}</p>${phaseBar(1)}

/* Marks the single digit the question is about. The number is printed with a
   thin space every three, so splitting on spaces marked a whole group. */
function pvMark(q){
 let k=-1;
 return String(q.show).split("").map(ch=>{
  if(/[0-9]/.test(ch)){ k++; if(k===q.hi) return '<b style="color:var(--band)">'+ch+'</b>'; }
  return esc(ch);
 }).join("");
}

/* ================= drawings for the question in front of you =================
   ART[] draws the worked example and always shows the same numbers. QART[]
   draws whatever is currently being asked \u2014 the child's own number in the
   place-value columns, their own rectangle, their own jump across zero.
   A picture that shows a different question is worse than no picture.
   v14: shown on the first two questions of a lesson and then put away, so the
   picture gets a child started and the rest they do as the test will ask.
   The reveal always shows it. */
/* v14 helpers for the question drawings */
const nums=q=>(String(q.show).replace(/(\d)[ \u2009\u00a0](?=\d{3}(?!\d))/g,"$1").match(/\d+(\.\d+)?/g)||[]).map(Number);
const QSVG=(w,h,inner,label)=>`<svg class="qart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img"${label?` aria-label="${esc(wl(label))}"`:""}>${inner}</svg>`;
const PVHEAD=n=>["100 000","10 000","1000","100","10","1"].slice(-n);
const QART={
 pvDigit(q){
  const d=String(q.show).replace(/\D/g,"").split("");
  const lab=["1","10","100","1 000","10 000","100 000","1 000 000"];
  const w=Math.min(42, 300/d.length);
  return `<svg class="qart" viewBox="0 0 ${d.length*w+10} 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(wl(Lb(`${q.show} in place-value columns`,`${q.show} en colonnes`)))}">
   ${d.map((ch,i)=>{
     const hi=(i===q.hi), x=5+i*w;
     const place=lab[d.length-1-i]||"";
     return `<rect x="${x}" y="8" width="${w-5}" height="44" rx="6"
        fill="${hi?"var(--band)":"#fff"}" stroke="${hi?"var(--band)":"var(--line)"}" stroke-width="2"/>
       <text x="${x+(w-5)/2}" y="39" text-anchor="middle" font-size="23" font-weight="600"
        fill="${hi?"#fff":"var(--ink)"}">${ch}</text>
       <text x="${x+(w-5)/2}" y="70" text-anchor="middle" font-size="8.5"
        fill="var(--muted)">${place}</text>`;}).join("")}
  </svg>`;
 },
 negGap(q){
  const m=String(q.show).match(/(-?\d+)\D+(-?\d+)/); if(!m) return "";
  const a=+m[1], b=+m[2];
  const lo=Math.min(a,b,0)-1, hi=Math.max(a,b,0)+1, n=hi-lo;
  const W=280, X=v=>10+(v-lo)/n*(W-20);
  let s=`<line x1="10" y1="52" x2="${W-10}" y2="52" stroke="var(--line)" stroke-width="2"/>`;
  for(let v=lo;v<=hi;v++){
   s+=`<line x1="${X(v)}" y1="47" x2="${X(v)}" y2="57" stroke="${v===0?"var(--ink)":"var(--line)"}"
       stroke-width="${v===0?2:1}"/>`;
   if(n<=14||v%2===0) s+=`<text x="${X(v)}" y="72" text-anchor="middle" font-size="9"
       fill="var(--muted)">${v}</text>`;
  }
  s+=`<path d="M${X(a)} 44 Q${X((a+b)/2)} 12 ${X(b)} 44" fill="none"
      stroke="var(--band)" stroke-width="2.5"/>
      <circle cx="${X(a)}" cy="52" r="4.5" fill="var(--band)"/>
      <circle cx="${X(b)}" cy="52" r="4.5" fill="var(--sun)"/>`;
  return `<svg class="qart" viewBox="0 0 ${W} 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(wl(Lb(`A number line with the jump from ${a} to ${b}`,`Une droite avec le saut de ${a} à ${b}`)))}">${s}</svg>`;
 },
 areaRect(q){
  const m=String(q.show).match(/(\d+)cm \u00d7 (\d+)cm/); if(!m) return "";
  const a=+m[1], b=+m[2], cell=Math.min(20, 240/a, 120/b);
  let s="";
  for(let r=0;r<b;r++) for(let c=0;c<a;c++)
   s+=`<rect x="${14+c*cell}" y="${10+r*cell}" width="${cell-1.5}" height="${cell-1.5}" rx="1.5"
      fill="var(--band)" opacity=".28" stroke="var(--line)" stroke-width=".8"/>`;
  s+=`<text x="${14+a*cell/2}" y="${22+b*cell}" text-anchor="middle" font-size="10"
      fill="var(--muted)">${a} cm</text>
      <text x="8" y="${10+b*cell/2}" font-size="10" fill="var(--muted)"
      transform="rotate(-90 8 ${10+b*cell/2})">${b} cm</text>`;
  return `<svg class="qart" viewBox="0 0 ${24+a*cell} ${30+b*cell}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(wl(Lb(`A rectangle of ${a} by ${b} squares`,`Un rectangle de ${a} sur ${b} carrés`)))}">${s}</svg>`;
 },

  const m=String(q.show).match(/base (\d+)cm, height (\d+)cm/); if(!m) return "";

   s+=`<rect x="${16+col*dx+r*dy}" y="${H-30-r*dy*.75}" width="${u}" height="${u*.7}" rx="1.5"

        stroke-dasharray="5 4" marker-end="url(#vup)"/>

      <text x="16" y="${H-12}" font-size="10" fill="var(--muted)">${wl(Lb(`one layer is ${a} \u00d7 ${b} = ${a*b}`,`une couche : ${a} \u00d7 ${b} = ${a*b}`))}</text>`;
  return `<svg class="qart" viewBox="0 0 ${W+70} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(wl(Lb(`A box ${a} by ${b} by ${c}`,`Une boîte de ${a} sur ${b} sur ${c}`)))}">${s}</svg>`;
 },

 ooo(q){ const [a,b,c]=nums(q), parts=Array(b).fill(c).concat([a]);
  return QSVG(260,84,barModel(parts,parts.map((_,i)=>i<b?C.on:C.warm),parts.map((_,i)=>i<b?String(c):String(a)),
   {y:30,w:Math.min(240,(a+b*c)*9),fs:10,over:[{from:0,to:b-1,label:Lb(`${b} × ${c} first`,`${b} × ${c} d'abord`),color:C.on}],under:[{from:b,to:b,label:Lb("then +","puis +"),color:C.warm}]}),
   Lb(`${b} bars of ${c}, then ${a} more`,`${b} barres de ${c}, puis ${a} de plus`)); },
 frMul(q){ const [a,b,c,d]=nums(q);
  const sh=(r,col)=>col<a&&r<c?C.on:col<a?"#CDE6D7":r<c?"#F3E2B9":"#fff";
  return QSVG(250,112,areaGrid(d,b,{},sh,{x:70,y:18,w:140,h:84,gap:2})+tx(140,12,`${a}/${b}`,{c:C.on,b:true})+
   tx(62,60,`${c}/${d}`,{a:"end",c:C.warm,b:true}),Lb(`A grid ${b} wide and ${d} tall: ${a}/${b} one way, ${c}/${d} the other`,`Une grille de ${b} sur ${d} : ${a}/${b} dans un sens, ${c}/${d} dans l'autre`)); },
 frDivWhole(q){ const [,b,c]=nums(q), parts=Array(c).fill(1/c).concat(Array(b-1).fill(1));
  return QSVG(260,92,barModel(parts,parts.map((_,i)=>i===0?C.on:i<c?"#CDE6D7":C.off),[],
   {y:32,over:[{from:0,to:c-1,label:`1/${b}`,color:C.on}],under:[{from:0,to:c-1,label:Lb(`cut into ${c}`,`coupé en ${c}`),color:C.warm}]}),
   Lb(`A bar in ${b} parts, the first cut into ${c}`,`Une barre en ${b} parts, la première coupée en ${c}`)); },
 pcOf(q){ const [p,n]=nums(q);
  return QSVG(260,86,barModel(10,0,Array(10).fill(String(n/10)),{y:36,fs:9,over:[{from:0,to:9,label:sp(n),color:C.mut}],
   under:[{from:0,to:0,label:"10%",color:C.on}]}),Lb(`${sp(n)} in ten parts of ${n/10}`,`${sp(n)} en dix parts de ${n/10}`)); },
 fdp(q){ const v=q.show.includes("%")?parseFloat(q.show)/100:q.show.includes("/")?nums(q)[0]/nums(q)[1]:+q.show;
  return QSVG(260,74,numberLine(0,1,[{v:v,label:q.show,color:C.on}],[],{y:44,step:.1,every:1,fmt:v=>v}),
   Lb(`${q.show} on a number line from 0 to 1`,`${q.show} sur une droite de 0 à 1`)); },
 decAdd(q){ const [a,b]=q.show.split(" + ");
  return QSVG(220,110,pvColumns([a,b,""],"show",{},{x:220-COLW([a,b])*28-30,y:34,cw:28,op:"+",rule:2}),
   Lb("The two decimals with their points lined up","Les deux décimaux avec les virgules alignées")); },
 decMul(q){ const [a,b]=q.show.split(" × "), w=+a.replace(".","");
  return QSVG(250,64,pvColumns([a],"cover",{},{x:30,y:44,fs:24})+tx(120,32,`${w} × ${b}`,{a:"start",c:C.on,b:true,fs:14})+
   tx(120,50,Lb("then put the point back","puis remets la virgule"),{a:"start",fs:10}),
   Lb(`${a} with the point covered`,`${a} avec la virgule cachée`)); },
 round(q){ const n=+String(q.show).replace(/\D/g,""), p=+String(q.p).replace(/\D/g,""), lo=Math.floor(n/p)*p;
  return QSVG(260,84,numberLine(lo,lo+p,[{v:lo+p/2,color:C.warm,r:3},{v:n,label:sp(n),color:C.on,below:true}],[],{y:40,step:p/10,every:p,fmt:v=>sp(v)})+
   tx(130,24,Lb("halfway","à mi-chemin"),{c:C.warm,b:true,fs:10}),Lb(`${sp(n)} between ${sp(lo)} and ${sp(lo+p)}`,`${sp(n)} entre ${sp(lo)} et ${sp(lo+p)}`)); },
 metric(q){ const m=String(q.show).match(/([\d.]+)(\w+)\s+=\s+\?\s+(\w+)/); if(!m) return "";
  const v=+m[1], u0=m[2], u1=m[3], f={km:1000,m:100,cm:10,kg:1000,l:1000}[u0], lo=Math.floor(v);
  return QSVG(260,92,numberLine(lo,lo+1,[{v:v,label:`${v} ${u0}`,color:C.on}],[],{y:46,step:.1,every:1,fmt:x=>`${x} ${u0}`})+
   tx(14,84,`${lo} ${u0} = ${sp(lo*f)} ${u1}`,{a:"start",fs:10})+tx(246,84,`${lo+1} ${u0} = ${sp((lo+1)*f)} ${u1}`,{a:"end",fs:10}),
   Lb(`${v} ${u0} between ${lo} and ${lo+1} ${u0}`,`${v} ${u0} entre ${lo} et ${lo+1} ${u0}`)); },
 mean(q){ const v=nums(q), mx=Math.max(...v), u=Math.min(10,200/mx);
  let s=""; v.forEach((n,k)=>{ for(let i=0;i<n;i++) s+=`<rect x="${34+i*u}" y="${6+k*20}" width="${u-1.5}" height="14" rx="2" fill="${C.on}"/>`;
   s+=tx(28,17+k*20,String(n),{a:"end"}); });
  return QSVG(260,v.length*20+10,s,Lb(`Rows of ${v.join(", ")} blocks to level out`,`Des rangées de ${v.join(", ")} blocs à égaliser`)); },
 formula(q){ const [m,c,x]=nums(q);
  let s=tx(40,36,`y = ${m} ×`,{a:"start",fs:18,b:600,c:C.ink});
  const bx=40+(`y = ${m} ×`.length)*9+4;
  s+=`<rect x="${bx}" y="16" width="28" height="28" rx="6" fill="#fff" stroke="${C.on}" stroke-width="2"/>`+tx(bx+14,36,"x",{fs:16,b:600,c:C.on})+
   tx(bx+36,36,`+ ${c}`,{a:"start",fs:18,b:600,c:C.ink})+tx(bx+14,64,Lb(`x = ${x} goes in the box`,`x = ${x} va dans la case`),{c:C.warm,b:true});
  return QSVG(260,72,s,Lb(`y = ${m} × a box + ${c}, with ${x} to put in the box`,`y = ${m} × une case + ${c}, avec ${x} à mettre dans la case`)); },
 twoUnknowns(q){ const [s0,p]=nums(q), P=[]; for(let k=1;k*k<=p;k++) if(p%k===0) P.push([k,p/k]);
  let s=tx(70,14,`× = ${p}`,{b:true})+tx(180,14,`+ = ${s0}?`,{b:true});
  P.forEach(([a,b],i)=>{ s+=tx(70,34+i*18,`${a} × ${b}`,{fs:12,b:600,c:C.ink})+tx(180,34+i*18,`${a} + ${b} = ?`,{fs:12}); });
  return QSVG(260,P.length*18+26,s,Lb(`The pairs that multiply to ${p}`,`Les paires de produit ${p}`)); },
};
/* The question as it is asked: the prompt, the drawing if there is one, and
   the sum. Shared by practice, today's practice and the reveal, so all three
   say the same thing in the same language. */
function qHead(q,s,pic){
 const P=pic?(QART[q.ask]||QART[s.g]):null, drawn=P?`<div class="qartbox">${P(q)}</div>`:"";
 if(q.ask==="pickAll") return `<p class="hint">${esc(t("pickall"))} \u2014 ${esc(t(q.lab))} ${q.show?esc(q.show):""}</p>`;
 if(q.ask==="share") return `<p class="hint">${q.r1} : ${q.r2}</p>${drawn}<div class="qbig num">${esc(q.show)}</div>`;
 const hint=q.hint?`<p class="qq">${esc(L==="fr"&&q.hintFr?q.hintFr:q.hint)}</p>`
  :(q.ask==="round"?`<p class="qq">${L==="fr"?"au":"to the nearest"} ${esc(q.p)}</p>`:"");
 const shown = q.ask==="pvDigit" ? pvMark(q) : esc(q.show);
 return hint+drawn+`<div class="${String(q.show).length>10?"qmid":"qbig"} num">${shown}</div>`;
}
/* v13: the reveal used to replace the whole card with "The answer was 1/8".
   The question went and nothing said how. Now the question stays, the answer
   sits under it, and the working is the lesson's own steps with these
   numbers. A generator with no working yet falls back to the example. */
function revealHTML(q,s,canBack){
 const work=(q.work||[]).map(wl), ans=Array.isArray(q.a)?q.a.join(", "):String(q.a);
 return `${qHead(q,s,true)}
  <div class="reveal"><p class="rl">${esc(t("theans"))}</p>
   <p class="ra num${ans.length>10?" long":""}">${esc(ans)}</p></div>
  ${work.length?`<div class="workbox"><p class="rl">${esc(t("howto"))}</p>
    <ol class="rsteps work">${work.map(x=>`<li class="num">${esc(x)}</li>`).join("")}</ol></div>`
   :(canBack&&TEACH[s.g]?`<button class="go2 warm small" onclick="backToWatch()">${esc(t("exagain"))}</button>`:"")}`;
}
/* v13: after two misses this always showed the reason for step one, so every
   question in a lesson got the same hint whatever the child had done. A
   wrong answer the generator recognises (adding the bottoms, forgetting the
   zero) points at the step it skipped; anything else points at the step
   that produces the answer. */
/* It sits at the TOP of the card, with the way out inside it. Under the
   keypad it was below the bottom of a phone screen, so a child who had
   missed twice pressed \u2713 and saw nothing change. */
function stuckNote(s,giveFn,extra){
 const T2=EX(s), n=T2?T2.steps.length:0, hit=V.trap;
 const txt = (hit!==undefined&&typeof hit==="object") ? wl(hit)
  : T2 ? w(T2.steps[Math.min(typeof hit==="number"?hit:n-1,n-1)],"why") : "";
 return `<div class="note stuck">${txt?`<span>${esc(t("look"))} \u2014 ${esc(txt)}</span>`:""}
  <span class="stuckbtns"><button class="go2 quiet small" onclick="${giveFn}()">${esc(t("giveup"))}</button>${extra||""}</span></div>`;
}
function noteTrap(q,typed){ const k=norm(typed); if(q&&q.traps&&q.traps[k]!==undefined) V.trap=q.traps[k]; }
function drillHTML(s){
 /* v5: the character was introduced and then abandoned, including in the
    practice for her own stop. Two words at the top keep her there. */
 const who=(TEACH[s.g]&&TEACH[s.g].story[0].em)||"";
 const q=V.q, dots=Array.from({length:s.n}).map((_,k)=>`<i class="${k<V.i?"on":""}"></i>`).join("");
 let body="";
 if(q.ask==="pickAll"){
  const ch=V.pick||[];
  body=qHead(q,s,false)+`
   <div class="opts" style="grid-template-columns:repeat(4,1fr)">${q.opts.map(o=>
   `<button class="opt${ch.includes(o)?(q.ok(o)?" yes":" no"):""}" onclick="tapAll(${o})">${o}</button>`).join("")}</div>`;
 } else {
  /* v11: the drawing was made for the worked example and shown once. Here it
     is again, drawn from THIS question — the child's own number in the columns,
     their own rectangle, their own jump across zero. */
  body=qHead(q,s,V.i<2)+keypad();
 }
 const T2=EX(s);
 return `<div class="wrap"><p class="step">${who} ${esc(s[L]||s.en)} \u00b7 ${V.i+1} ${esc(t("of"))} ${s.n}</p>
  ${T2?phaseBar(2):""}
  ${!V.shown&&V.i===0&&TRAP[s.g]?`<div class="trap">\u26a0\ufe0f ${esc(TRAP[s.g][L]||TRAP[s.g].en)}</div>`:""}
  ${V.said?`<div class="nice${V.saidFix?" fix":""}">${esc(V.said)}</div>`:""}
  ${""/* v5: the teaching was a gate at the front of the stop and nothing more.
       A child getting them wrong could only be shown the same one-line reason
       again. Three wrong and the worked example is offered back — the whole
       of it, not a hint. */}
  ${""/* v7: a learner missing these repeatedly is sent back to the explainer
       for this subtopic. This is why the videos are indexed by subtopic rather
       than sitting in a playlist. */}
  <div class="card">${!V.shown&&V.miss>=2?stuckNote(s,"giveUp",V.bad>=3?againBtn(s):""):""}
  ${V.shown?revealHTML(q,s,true):body+peekHTML(T2)}
  ${!V.shown&&V.miss<2&&V.bad>=3?againBtn(s):""}
  <div class="tally">${dots}</div></div>
  ${V.shown?`<button class="go2" onclick="moveOn()">${esc(t("moveon"))}</button>`:""}
  </div>`;
}
function againBtn(s){
 return TEACH[s.g]?`<button class="go2 warm small" onclick="backToWatch()">${(VIDEO[s.g]||{})[L]?"\u25b6 "+esc(t("vidagain")):esc(t("exagain"))}</button>`:"";
}
function doneHTML(s){
 return `<div class="wrap"><div class="card res"><div class="em">\u26fa</div>
  <h2>${esc(t("camp"))}</h2><p class="num">${S.b[s.id]||0} ${esc(t("of"))} ${s.n}</p></div>
  <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
  <button class="go2 quiet" onclick="openStop('${V.id}')">${esc(t("again"))}</button></div>`;
}
function keypad(){
 return `<div class="slot ${V.typed===""?"empty":""} num">${V.typed===""?"\u2013":esc(V.typed)}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="tap('${n}')">${n}</button>`).join("")}
   <button class="key" onclick="tap('.')">.</button><button class="key" onclick="tap('0')">0</button>
   <button class="key" onclick="tap('/')">/</button>
   <button class="key" onclick="tap('-')">\u2212</button>
   <button class="key" onclick="del()">\u232b</button>
   <button class="key go" onclick="check()">\u2713</button></div>`;
}
function tap(c){if(V.typed.length<12)V.typed+=c;render()}
function del(){V.typed=V.typed.slice(0,-1);render()}
function tapAll(o){
 const q=V.q; if(!V.pick)V.pick=[];
 if(!V.pick.includes(o))V.pick.push(o);
 const need=q.opts.filter(q.ok);
 if(need.every(x=>V.pick.includes(x))){ if(V.pick.some(x=>!q.ok(x)))V.bad++; advance(); }
 else if(V.pick.some(x=>!q.ok(x))){V.miss++;V.bad++;}
 render();
}
/* v8: the same dead end the English app had. A wrong answer kept a child on
   the same question for ever — no skip, no reveal, and the only way out was to
   close the app. Two wrong and the answer is offered; taking it costs the mark
   and moves on, which is what a teacher would do. */
function giveUp(){ V.shown=true; render(); }
function moveOn(){ V.shown=false; V.bad=(V.bad||0)+1; V.said=null; advance(); render(); }
function check(){
 if(V.typed==="")return;
 V.said=null;
 if(V.ph==="guided"){
  const steps=EX(byId(V.id)).guided.steps;
  if(norm(V.typed)===norm(steps[V.g].a)){
   V.g++; V.typed=""; V.miss=0;
   if(V.g>=steps.length){ V.ph="drill"; V.i=0; V.bad=0; newQ();
     S.at={id:V.id,ph:"drill",i:0}; save(); }
  } else { V.miss++; V.typed=""; }
  render(); return;
 }
 if(norm(V.typed)===norm(V.q.a)) advance();
 else { noteTrap(V.q,V.typed); V.miss++; V.bad++; V.typed="";
   if(!V.wrongOnce) V.wrongOnce={}; V.wrongOnce[V.i]=1;
   render(); }
}
/* v4: the place is kept. A child doing twenty minutes after school was
   starting the same stop from question one every time. */
function resume(){
 const a=S.at; if(!a) return; const s=byId(a.id); if(!s) return;
 openStop(a.id);
 if(a.ph==="drill"){ V.ph="drill"; V.i=Math.min(a.i,s.n-1); V.bad=0; newQ(); }
 else if(a.ph==="guided") toGuided();
 else if(a.ph==="watch") toWatch();
 render();
}
function advance(){
 const s=byId(V.id);
 /* v6: something happens when a child is right. Before this the counter went
    up and the next question appeared, 486 times. */
 const fixed = V.wrongOnce && V.wrongOnce[V.i];
 V.said = fixed ? (FIXED[L]||FIXED.en) : (NICE[L]||NICE.en)[(V.i+s.id.length)%10];
 V.saidFix = !!fixed;
 V.i++; V.shown=false;
 S.at={id:V.id,ph:"drill",i:V.i}; save();
 if(V.i>=s.n){ S.d[s.id]=1; S.b[s.id]=Math.max(S.b[s.id]||0,Math.max(0,s.n-V.bad)); save(); tellHost(); V.ph="done"; }
 else newQ();
 render();
}

/* ================= the arithmetic paper =================
   36 questions, 30 minutes, no options, in the proportions Paper 1 actually
   uses: mostly one-mark calculations, with long multiplication and long
   division worth two each and placed late, as they are in the real thing. */
const PAPERMIX=[["colAdd",1],["colSub",1],["tables",1],["mentalPV",1],["shortMul",1],["shortDiv",1],
 ["pow10",1],["frAddSame",1],["frAddDiff",1],["frMul",1],["frDivWhole",1],["frOfAmount",1],
 ["decAdd",1],["decMul",1],["pcOf",1],["sqcube",1],["ooo",1],["divRem",1]];
function openPaper(){
 const qs=[]; const seed=Date.now()%99991;
 for(let i=0;i<32;i++){ const g=PAPERMIX[i%PAPERMIX.length][0];
   qs.push(Object.assign(GEN[g](R(seed+i*7919),1+(i%2)),{m:1})); }
 qs.splice(13,0,Object.assign(GEN.longMul(R(seed+911),1),{m:2}));
 qs.splice(24,0,Object.assign(GEN.longDiv(R(seed+922),1),{m:2}));
 qs.push(Object.assign(GEN.longMul(R(seed+933),2),{m:2}));
 qs.push(Object.assign(GEN.longDiv(R(seed+944),2),{m:2}));
 V={s:"paper",qs:qs,i:0,ans:qs.map(()=>""),t0:Date.now(),over:false,mark:null};
 tick(); render();
}
let TID=null;
function tick(){ clearInterval(TID); TID=setInterval(()=>{
  if(V.s!=="paper"||V.mark){clearInterval(TID);return}
  const left=1800-Math.floor((Date.now()-V.t0)/1000);
  if(left<=0){ clearInterval(TID); markPaper(); return }
  const e=document.getElementById("clk");
  if(e){ e.textContent=fmt(left); e.className="timer"+(left<300?" low":""); }
 },500); }
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function paperHTML(){
 if(V.mark) {
  const tot=V.qs.reduce((a,q)=>a+q.m,0);
  return `<div class="wrap"><div class="card res"><div class="em">\u{1f4c4}</div>
   <h2 class="num">${V.mark} / ${tot}</h2><p>${esc(t("score"))}</p>
   <div class="bar2"><i style="width:${Math.round(V.mark/tot*100)}%"></i></div></div>
   <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
   <button class="go2 quiet" onclick="openPaper()">${esc(t("again"))}</button></div>`;
 }
 const q=V.qs[V.i];
 return `<div class="wrap">
  <div class="step" style="display:flex;justify-content:space-between;align-items:center">
   <span>${V.i+1} ${esc(t("of"))} ${V.qs.length}${q.m>1?"  \u00b7 2 "+esc(t("score")):""}</span>
   <span class="timer" id="clk">30:00</span></div>
  <div class="card">
   <div class="${String(q.show).length>10?"qmid":"qbig"} num">${esc(q.show)}</div>
   <div class="slot ${V.ans[V.i]===""?"empty":""} num">${V.ans[V.i]===""?"\u2013":esc(V.ans[V.i])}</div>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="ptap('${n}')">${n}</button>`).join("")}
    <button class="key" onclick="ptap('.')">.</button><button class="key" onclick="ptap('0')">0</button>
    <button class="key" onclick="ptap('/')">/</button>
    <button class="key" onclick="ptap('-')">\u2212</button>
    <button class="key" onclick="pdel()">\u232b</button>
    <button class="key go" onclick="pnext()">\u203a</button></div>
   <div class="pgrid">${V.qs.map((_,k)=>`<button class="pg${V.ans[k]!==""?" ans":""}${k===V.i?" now":""}"
     onclick="pgo(${k})">${k+1}</button>`).join("")}</div>
  </div>
  <button class="go2 quiet" onclick="markPaper()">${esc(t("finish"))}</button></div>`;
}
function ptap(c){ if(V.ans[V.i].length<12) V.ans[V.i]+=c; render(); }
function pdel(){ V.ans[V.i]=V.ans[V.i].slice(0,-1); render(); }
function pgo(k){ V.i=k; render(); }
function pnext(){ V.i=(V.i+1)%V.qs.length; render(); }
function markPaper(){
 let m=0; V.qs.forEach((q,k)=>{ if(V.ans[k]!==""&&norm(V.ans[k])===norm(q.a)) m+=q.m; });
 V.mark=m; S.p=(S.p||[]).concat([m]); save(); render();
}

if(S.seen) V={s:"shelf",open:null};
render();
</script></body></html>
